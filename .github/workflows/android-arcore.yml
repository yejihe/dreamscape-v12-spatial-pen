name: Build V12 Android ARCore Diagnostic APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-arcore.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR" || { echo "sdkmanager not found under $SDK_ROOT"; exit 1; }
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Load stable debug signing (when configured)
        env:
          KEYSTORE_B64: ${{ secrets.DREAMSCAPE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.DREAMSCAPE_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASS" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dreamscape-debug.jks"
            echo "DREAMSCAPE_KEYSTORE_FILE=$RUNNER_TEMP/dreamscape-debug.jks" >> "$GITHUB_ENV"
            echo "::add-mask::$KEYSTORE_PASS"
            echo "DREAMSCAPE_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "Stable signing enabled"
          else
            echo "::warning::Stable signing secrets not configured. Generated APK uses temporary debug key; future builds may not install over it."
          fi
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dreamscape-v12-arcore-probe-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
