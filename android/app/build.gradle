plugins { id 'com.android.application' }
def fixedStore = System.getenv('DREAMSCAPE_KEYSTORE_FILE')
def fixedPass = System.getenv('DREAMSCAPE_KEYSTORE_PASSWORD')
android {
    namespace 'com.dreamscape.arprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'com.dreamscape.arprobe'
        minSdk 26
        targetSdk 28
        versionCode 10
        versionName '0.3.5'
    }
    if (fixedStore && fixedPass) {
        signingConfigs {
            stableDebug {
                storeFile file(fixedStore)
                storePassword fixedPass
                keyAlias 'dreamscape-debug'
                keyPassword fixedPass
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.stableDebug }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'com.google.ar:core:1.56.0' }
